<div class="hero">
<div class="card"><h2 style="margin:0">Dashboard Guru</h2><p style="font-size:12px;color:#6b5b8a;margin:6px 0 0" id="headerDesc">Login untuk akses data</p></div>
<div class="card"><b>🔥 Data Responsif</b>
<div class="stat"><div class="s3"><b id="cHadir">0</b><small>Hadir</small></div><div class="s2"><b id="cIzin">0</b><small>Izin</small></div><div class="s1"><b id="cSakit">0</b><small>Sakit</small></div><div class="s4"><b id="cAlfa">0</b><small>Alfa</small></div></div>

<div class="card hidden" id="dashData" style="margin-top:16px">
<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">📋 Data Lengkap</h3></div>
<div class="filterGrid">
  <div class="dateWrap" id="dateWrap"><input id="fTanggal" type="date" onchange="onDateChange()"><span class="datePh" id="datePh">📅 Tanggal</span></div>

  <select id="fMapel" class="fInput"></select>
  <select id="fGuru" class="fInput"></select>
  <select id="fStatus" class="fInput" onchange="render()"><option value="">Semua Status</option><option>Hadir</option><option>Izin</option><option>Sakit</option><option>Alfa</option></select>
  <button class="btn btn-yellow" onclick="resetFilter()">Reset</button>
</div>
<p id="infoFilter" style="font-size:11px;color:#6b5b8a;margin:8px 0"></p>
<div id="rekapArea" class="rekapGrid hidden"></div>
<button class="btn btn-blue" style="width:100%;margin:10px 0 8px" onclick="downloadExcel()">📊 Download Excel</button>
<div class="tableWrap">
<table><thead><tr><th>NAMA</th><th>STATUS</th><th>GURU</th><th>MAPEL</th><th>TANGGAL</th><th>JAM</th><th>AKSI</th></tr></thead><tbody id="tbody"></tbody></table>
</div>
<button class="btn" style="width:100%;background:#ff5a5f;color:#fff;margin-top:10px" onclick="hapusSemua()">Hapus Data Terfilter</button>
